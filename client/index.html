<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Support Agent</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container {
            height: calc(100vh - 200px);
            max-height: 600px;
        }
        .message-bubble {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing-indicator {
            display: inline-flex;
            align-items: center;
        }
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: #6366f1;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
        .language-btn {
            transition: all 0.3s ease;
        }
        .language-btn.active {
            background-color: #4f46e5;
            color: white;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = 'http://localhost:5001/api';

        const languages = [
            { code: 'en', name: 'English', native: 'English' },
            { code: 'hi', name: 'Hindi', native: ' Hindi' },
            { code: 'ta', name: 'Tamil', native: ' Tamil' },
            { code: 'te', name: 'Telugu', native: ' Telugu' },
            { code: 'kn', name: 'Kannada', native: ' Kannada' }
        ];

        const demoQueries = {
            en: [
                'What is my KYC status?',
                'My transaction failed',
                'What is my account balance?',
                'I lost my debit card',
                'Help me with net banking'
            ],
            hi: [
                'Mera KYC status kya hai?',
                'Mera transaction fail ho gaya',
                'Mera account balance kitna hai?',
                'Mera debit card kho gaya',
                'Net banking mein help karein'
            ],
            ta: [
                'Enna KYC status?',
                'En transaction aagala',
                'En account balance enna?',
                'En debit card azhagiyachu',
                'Net banking la help pannunga'
            ],
            te: [
                'Naa KYC status emi?',
                'Naa transaction ayindi',
                'Naa account balance emi?',
                'Naa debit card pothundi',
                'Net banking lo help cheyandi'
            ],
            kn: [
                'Nanna KYC status enu?',
                'Nanna transaction aagilla',
                'Nanna account balance enu?',
                'Nanna debit card hogayide',
                'Net banking alli help madi'
            ]
        };

        function Chatbot() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [selectedLanguage, setSelectedLanguage] = useState('en');
            const [isLoading, setIsLoading] = useState(false);
            const [detectedLanguage, setDetectedLanguage] = useState('en');
            const [showDemo, setShowDemo] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const addMessage = (text, isUser = false, language = 'en') => {
                const newMessage = {
                    id: Date.now(),
                    text,
                    isUser,
                    language,
                    timestamp: new Date().toLocaleTimeString()
                };
                setMessages(prev => [...prev, newMessage]);
            };

            const handleSendMessage = async () => {
                if (!input.trim()) return;

                const userMessage = input.trim();
                addMessage(userMessage, true, selectedLanguage);
                setInput('');
                setIsLoading(true);

                try {
                    const response = await fetch(`${API_BASE}/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: userMessage,
                            language: selectedLanguage
                        })
                    });

                    const data = await response.json();
                    
                    if (response.ok) {
                        addMessage(data.response, false, data.language);
                        setDetectedLanguage(data.language);
                        
                        if (data.escalated) {
                            addMessage('Note: This query has been escalated to a human agent for better assistance.', false, 'en');
                        }
                    } else {
                        addMessage('Sorry, I encountered an error. Please try again.', false, 'en');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    addMessage('Sorry, I\'m having trouble connecting. Please try again later.', false, 'en');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleDemoQuery = (query) => {
                setInput(query);
                setTimeout(() => handleSendMessage(), 100);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-4xl mx-auto">
                        {/* Header */}
                        <div className="bg-white rounded-t-xl shadow-lg p-6">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">
                                Multilingual Customer Support Agent
                            </h1>
                            <p className="text-gray-600 mb-4">
                                Get support in English, Hindi, Tamil, Telugu, and Kannada
                            </p>
                            
                            {/* Language Selection */}
                            <div className="flex flex-wrap gap-2 mb-4">
                                {languages.map(lang => (
                                    <button
                                        key={lang.code}
                                        onClick={() => setSelectedLanguage(lang.code)}
                                        className={`language-btn px-4 py-2 rounded-lg border-2 border-gray-300 font-medium transition-all ${
                                            selectedLanguage === lang.code ? 'active' : 'hover:border-indigo-400'
                                        }`}
                                    >
                                        {lang.native}
                                    </button>
                                ))}
                            </div>

                            {/* Demo Section */}
                            <div className="border-t pt-4">
                                <div className="flex items-center justify-between mb-2">
                                    <h3 className="text-sm font-semibold text-gray-700">Try Demo Queries:</h3>
                                    <button
                                        onClick={() => setShowDemo(!showDemo)}
                                        className="text-sm text-indigo-600 hover:text-indigo-800"
                                    >
                                        {showDemo ? 'Hide' : 'Show'}
                                    </button>
                                </div>
                                {showDemo && (
                                    <div className="flex flex-wrap gap-2">
                                        {demoQueries[selectedLanguage].map((query, index) => (
                                            <button
                                                key={index}
                                                onClick={() => handleDemoQuery(query)}
                                                className="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-full text-gray-700 transition-colors"
                                            >
                                                {query}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Chat Container */}
                        <div className="bg-white shadow-lg">
                            <div className="chat-container overflow-y-auto p-6 bg-gray-50">
                                {messages.length === 0 && (
                                    <div className="text-center text-gray-500 py-8">
                                        <div className="text-6xl mb-4"> </div>
                                        <p className="text-lg">Hello! How can I help you today?</p>
                                        <p className="text-sm mt-2">You can ask about KYC status, transactions, account balance, and more.</p>
                                    </div>
                                )}
                                
                                {messages.map((message) => (
                                    <div
                                        key={message.id}
                                        className={`flex mb-4 message-bubble ${
                                            message.isUser ? 'justify-end' : 'justify-start'
                                        }`}
                                    >
                                        <div
                                            className={`max-w-xs lg:max-w-md px-4 py-3 rounded-2xl ${
                                                message.isUser
                                                    ? 'bg-indigo-600 text-white'
                                                    : 'bg-white border border-gray-200 text-gray-800'
                                            }`}
                                        >
                                            <p className="text-sm">{message.text}</p>
                                            <p className={`text-xs mt-1 ${
                                                message.isUser ? 'text-indigo-200' : 'text-gray-500'
                                            }`}>
                                                {message.timestamp}
                                                {message.language && message.language !== selectedLanguage && (
                                                    <span className="ml-2">
                                                        ({message.language.toUpperCase()})
                                                    </span>
                                                )}
                                            </p>
                                        </div>
                                    </div>
                                ))}
                                
                                {isLoading && (
                                    <div className="flex justify-start mb-4">
                                        <div className="bg-white border border-gray-200 px-4 py-3 rounded-2xl">
                                            <div className="typing-indicator">
                                                <span></span>
                                                <span></span>
                                                <span></span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                
                                <div ref={messagesEndRef} />
                            </div>

                            {/* Input Area */}
                            <div className="border-t p-4 bg-white">
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyPress={handleKeyPress}
                                        placeholder={`Type your message in ${languages.find(l => l.code === selectedLanguage)?.name}...`}
                                        className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        disabled={isLoading}
                                    />
                                    <button
                                        onClick={handleSendMessage}
                                        disabled={isLoading || !input.trim()}
                                        className="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                    >
                                        {isLoading ? 'Sending...' : 'Send'}
                                    </button>
                                </div>
                                {detectedLanguage && detectedLanguage !== selectedLanguage && (
                                    <p className="text-xs text-gray-500 mt-2">
                                        Language detected: {languages.find(l => l.code === detectedLanguage)?.name}
                                    </p>
                                )}
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="bg-gray-800 text-white rounded-b-xl p-4 text-center">
                            <p className="text-sm">
                                Powered by AI | Supports 5 Indian languages | 24/7 Available
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Chatbot />, document.getElementById('root'));
    </script>
</body>
</html>
