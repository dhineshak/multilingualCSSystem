<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAN Query System - Investor Details</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: calc(100vh - 200px);
            max-height: 600px;
        }
        .message-bubble {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing-indicator {
            display: inline-flex;
            align-items: center;
        }
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: #6366f1;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
        .pan-input {
            text-transform: uppercase;
        }
        .data-table {
            max-height: 400px;
            overflow-y: auto;
        }
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = 'http://localhost:5001/api';

        const languages = [
            { code: 'en', name: 'English', native: 'English' },
            { code: 'hi', name: 'Hindi', native: ' Hindi' },
            { code: 'ta', name: 'Tamil', native: ' Tamil' },
            { code: 'te', name: 'Telugu', native: ' Telugu' },
            { code: 'kn', name: 'Kannada', native: ' Kannada' }
        ];

        const samplePANs = [
            'CPMPD6600L',
            'ABCDE1234F',
            'FGHIJ5678K',
            'KLMNO9012P'
        ];

        function PANQuerySystem() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [selectedLanguage, setSelectedLanguage] = useState('en');
            const [isLoading, setIsLoading] = useState(false);
            const [showData, setShowData] = useState(false);
            const [currentData, setCurrentData] = useState(null);
            const [dbStatus, setDbStatus] = useState('checking');
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            useEffect(() => {
                checkDatabaseStatus();
            }, []);

            const checkDatabaseStatus = async () => {
                try {
                    const response = await fetch(`${API_BASE}/health`);
                    const data = await response.json();
                    setDbStatus(data.dbInitialized ? 'connected' : 'disconnected');
                } catch (error) {
                    setDbStatus('disconnected');
                }
            };

            const addMessage = (text, isUser = false, type = 'text', data = null) => {
                const newMessage = {
                    id: Date.now(),
                    text,
                    isUser,
                    type,
                    data,
                    timestamp: new Date().toLocaleTimeString()
                };
                setMessages(prev => [...prev, newMessage]);
            };

            const isValidPAN = (pan) => {
                return /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/i.test(pan);
            };

            const handleSendMessage = async () => {
                if (!input.trim()) return;

                const userMessage = input.trim().toUpperCase();
                addMessage(userMessage, true, 'text');
                setInput('');
                setIsLoading(true);

                try {
                    // Check if it's a valid PAN
                    if (!isValidPAN(userMessage)) {
                        addMessage('Invalid PAN format. Please enter a valid PAN number (e.g., ABCDE1234F).', false, 'error');
                        setIsLoading(false);
                        return;
                    }

                    // Query PAN details
                    const response = await fetch(`${API_BASE}/pan-query`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            pan: userMessage,
                            language: selectedLanguage
                        })
                    });

                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        // Add AI response
                        addMessage(data.response, false, 'ai');
                        
                        // Add data message if records found
                        if (data.data && data.data.length > 0) {
                            addMessage(`Found ${data.data.length} record(s) for PAN: ${data.pan}`, false, 'info');
                            addMessage('View detailed information below', false, 'data', data.data);
                            setCurrentData(data.data);
                            setShowData(true);
                        } else {
                            addMessage(`No records found for PAN: ${data.pan}`, false, 'warning');
                        }
                    } else {
                        addMessage(data.error || 'Failed to query PAN details. Please try again.', false, 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    addMessage('Sorry, I\'m having trouble connecting to the database. Please try again later.', false, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSamplePAN = (pan) => {
                setInput(pan);
                setTimeout(() => handleSendMessage(), 100);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            };

            const formatValue = (value) => {
                if (value === null || value === undefined) return 'N/A';
                if (typeof value === 'string' && value.includes('T') && value.includes('Z')) {
                    return new Date(value).toLocaleString();
                }
                return value;
            };

            const renderMessage = (message) => {
                if (message.type === 'data' && message.data) {
                    return (
                        <div className="bg-gray-50 border border-gray-200 rounded-lg p-4 max-w-4xl">
                            <h4 className="font-semibold text-gray-800 mb-3">Investor Details</h4>
                            <div className="data-table">
                                {message.data.map((record, index) => (
                                    <div key={index} className="mb-4 p-3 bg-white rounded border border-gray-100">
                                        <h5 className="font-medium text-gray-700 mb-2">Record {index + 1}</h5>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 text-sm">
                                            {Object.entries(record).map(([key, value]) => (
                                                <div key={key} className="flex">
                                                    <span className="font-medium text-gray-600 mr-2">{key}:</span>
                                                    <span className="text-gray-800 break-all">{formatValue(value)}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                return (
                    <p className="text-sm whitespace-pre-wrap">{message.text}</p>
                );
            };

            const getMessageStyle = (message) => {
                if (message.type === 'error') {
                    return 'bg-red-100 border-red-200 text-red-800';
                }
                if (message.type === 'warning') {
                    return 'bg-yellow-100 border-yellow-200 text-yellow-800';
                }
                if (message.type === 'info') {
                    return 'bg-blue-100 border-blue-200 text-blue-800';
                }
                if (message.type === 'ai') {
                    return 'bg-green-50 border-green-200 text-green-800';
                }
                if (message.isUser) {
                    return 'bg-indigo-600 text-white';
                }
                return 'bg-white border border-gray-200 text-gray-800';
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-6xl mx-auto">
                        {/* Header */}
                        <div className="bg-white rounded-t-xl shadow-lg p-6">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-800 mb-2">
                                        <i className="fas fa-search mr-2 text-indigo-600"></i>
                                        PAN Query System
                                    </h1>
                                    <p className="text-gray-600">
                                        Enter a PAN number to get investor details and AI-powered insights
                                    </p>
                                </div>
                                <div className="flex items-center space-x-2">
                                    <div className={`pulse-dot w-3 h-3 rounded-full ${
                                        dbStatus === 'connected' ? 'bg-green-500' : 
                                        dbStatus === 'checking' ? 'bg-yellow-500' : 'bg-red-500'
                                    }`}></div>
                                    <span className="text-sm text-gray-600">
                                        Database: {dbStatus === 'connected' ? 'Connected' : 
                                                 dbStatus === 'checking' ? 'Checking...' : 'Disconnected'}
                                    </span>
                                </div>
                            </div>
                            
                            {/* Language Selection */}
                            <div className="flex flex-wrap gap-2 mb-4">
                                {languages.map(lang => (
                                    <button
                                        key={lang.code}
                                        onClick={() => setSelectedLanguage(lang.code)}
                                        className={`px-4 py-2 rounded-lg border-2 border-gray-300 font-medium transition-all ${
                                            selectedLanguage === lang.code 
                                                ? 'bg-indigo-600 text-white border-indigo-600' 
                                                : 'hover:border-indigo-400'
                                        }`}
                                    >
                                        {lang.native}
                                    </button>
                                ))}
                            </div>

                            {/* Sample PANs */}
                            <div className="border-t pt-4">
                                <h3 className="text-sm font-semibold text-gray-700 mb-2">Try Sample PANs:</h3>
                                <div className="flex flex-wrap gap-2">
                                    {samplePANs.map((pan, index) => (
                                        <button
                                            key={index}
                                            onClick={() => handleSamplePAN(pan)}
                                            className="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-full text-gray-700 transition-colors"
                                        >
                                            {pan}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Chat Container */}
                        <div className="bg-white shadow-lg">
                            <div className="chat-container overflow-y-auto p-6 bg-gray-50">
                                {messages.length === 0 && (
                                    <div className="text-center text-gray-500 py-8">
                                        <div className="text-6xl mb-4"> </div>
                                        <p className="text-lg font-medium">Welcome to PAN Query System!</p>
                                        <p className="text-sm mt-2">Enter a PAN number (e.g., ABCDE1234F) to get investor details.</p>
                                        <p className="text-sm mt-1">The system will provide both raw data and AI-powered insights.</p>
                                    </div>
                                )}
                                
                                {messages.map((message) => (
                                    <div
                                        key={message.id}
                                        className={`flex mb-4 message-bubble ${
                                            message.isUser ? 'justify-end' : 'justify-start'
                                        }`}
                                    >
                                        <div
                                            className={`max-w-4xl px-4 py-3 rounded-2xl ${getMessageStyle(message)}`}
                                        >
                                            {renderMessage(message)}
                                            <p className={`text-xs mt-2 ${
                                                message.isUser ? 'text-indigo-200' : 'text-gray-500'
                                            }`}>
                                                {message.timestamp}
                                            </p>
                                        </div>
                                    </div>
                                ))}
                                
                                {isLoading && (
                                    <div className="flex justify-start mb-4">
                                        <div className="bg-white border border-gray-200 px-4 py-3 rounded-2xl">
                                            <div className="typing-indicator">
                                                <span></span>
                                                <span></span>
                                                <span></span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                
                                <div ref={messagesEndRef} />
                            </div>

                            {/* Input Area */}
                            <div className="border-t p-4 bg-white">
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyPress={handleKeyPress}
                                        placeholder="Enter PAN number (e.g., ABCDE1234F)..."
                                        className="pan-input flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        disabled={isLoading}
                                        maxLength={10}
                                    />
                                    <button
                                        onClick={handleSendMessage}
                                        disabled={isLoading || !input.trim()}
                                        className="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                    >
                                        {isLoading ? (
                                            <span><i className="fas fa-spinner fa-spin mr-2"></i>Querying...</span>
                                        ) : (
                                            <span><i className="fas fa-search mr-2"></i>Query</span>
                                        )}
                                    </button>
                                </div>
                                <p className="text-xs text-gray-500 mt-2">
                                    Format: 5 letters + 4 numbers + 1 letter (e.g., ABCDE1234F)
                                </p>
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="bg-gray-800 text-white rounded-b-xl p-4 text-center">
                            <p className="text-sm">
                                <i className="fas fa-database mr-2"></i>
                                Real-time Database Queries | AI-Powered Insights | Secure & Fast
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PANQuerySystem />, document.getElementById('root'));
    </script>
</body>
</html>
